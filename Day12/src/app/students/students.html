<h1>Students List</h1>

<input
type="text"
[(ngModel)]="searchName"
placeholder="Search Student">

<button (click)="search()">
Search
</button>

<p>

Search Value : {{searchValue}}

</p>

<ul>

<li *ngFor="let student of students">

<a [routerLink]="['/students',student.id]">

{{student.name}}

</a>

</li>

</ul>
