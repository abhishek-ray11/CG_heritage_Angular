<div class="container">

    <h1>DAY17 RxJS Assignment</h1>

    <h2>Assignment 1</h2>

    <p>{{timerValue}}</p>

    <hr>

    <h2>Numbers Greater Than 25</h2>

    <ul>
        <li *ngFor="let n of squareNumbers">
            {{n}}
        </li>
    </ul>

    <button (click)="getPost()">
        Get Post using switchMap
    </button>

    <br><br>

    <div *ngIf="post">

        <h3>Post Details</h3>

        <p><b>ID :</b> {{post.id}}</p>

        <p><b>Title :</b> {{post.title}}</p>

        <p><b>Body :</b> {{post.body}}</p>

    </div>

    <hr>

    <h2>Users using mergeMap</h2>

    <div *ngFor="let user of users">

        <h3>{{user.name}}</h3>

        <p>{{user.email}}</p>

        <hr>

    </div>

</div>
