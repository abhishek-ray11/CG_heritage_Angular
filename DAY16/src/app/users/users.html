<div class="container">

<h1>Users Dashboard</h1>

<div class="search-box">

<input
type="text"
placeholder="Search User..."
[(ngModel)]="searchText"
(input)="searchUser()">

<button (click)="testError()">
Test Error
</button>

</div>

<div class="error" *ngIf="errorMessage">

{{errorMessage}}

</div>

<div class="card" *ngFor="let user of users">

<h2>{{user.name}}</h2>

<p>{{user.email}}</p>

</div>

</div>
